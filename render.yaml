# Render blueprint: one web service serves both the API and the built frontend.
# The Postgres database below is created with the service and wired in as
# DATABASE_URL. Set the secrets marked `sync: false` in the Render dashboard.
services:
  - type: web
    name: pathway-penguin
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false &&
      PORT=5173 BASE_PATH=/ pnpm --filter @workspace/pathway-penguin run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.cjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: STATIC_DIR
        value: artifacts/pathway-penguin/dist/public
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-penguin-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: pathway-penguin-db
    plan: free
    databaseName: pathway_penguin
    user: pathway_penguin
